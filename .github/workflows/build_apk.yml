name: Android Release Build (Signed Production APK)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # 🌟 اگر زپ فائل اپلوڈ کی گئی ہو تو خودکار طریقے سے ان زپ کرنا
      - name: Auto-extract project zip if uploaded
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip file: $ZIP_FILE. Extracting..."
            mkdir -p ./unpacked_temp
            unzip -o "$ZIP_FILE" -d ./unpacked_temp/

            PROJECT_ROOT=$(find ./unpacked_temp -name "settings.gradle.kts" -o -name "settings.gradle" -o -name "gradlew" | head -n 1 | xargs -r dirname)
            if [ -n "$PROJECT_ROOT" ]; then
              echo "Project located in: $PROJECT_ROOT. Moving files to repo root..."
              cp -rn "$PROJECT_ROOT"/* . 2>/dev/null || true
              cp -rn "$PROJECT_ROOT"/.[!.]* . 2>/dev/null || true
            fi
            rm -rf ./unpacked_temp
            echo "Extraction completed successfully."
          else
            echo "Working with repository files directly."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      # 🌟 GitHub Secrets سے آپ کی Keystore فائل ڈیکوڈ کرنا
      - name: Decode Release Keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p app
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            echo "Keystore decoded successfully. Size: $(wc -c < app/release.keystore) bytes."
          else
            echo "ERROR: KEYSTORE_BASE64 secret not found in repository secrets!"
            exit 1
          fi

      - name: Grant execute permission for gradlew
        run: |
          chmod +x ./gradlew

      # 🌟 آپ کے سیکرٹس (STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) کے ساتھ خالص دستخط شدہ Release APK بنانا
      - name: Build Signed Production Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease --stacktrace

      # 🌟 تیار شدہ Release APK گٹ ہب ایکشنز کے Artifacts میں اپلوڈ کرنا
      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: LerzaPlayer-Production-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
