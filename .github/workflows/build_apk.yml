name: Android Release Build (Signed Production APK)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # 🌟 اگر زپ فائل اپلوڈ کی گئی ہو تو خودکار طریقے سے ان زپ کرنا
      - name: Auto-extract project zip if uploaded
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip file: $ZIP_FILE. Extracting..."
            mkdir -p ./unpacked_temp
            unzip -o "$ZIP_FILE" -d ./unpacked_temp/

            PROJECT_ROOT=$(find ./unpacked_temp -name "settings.gradle.kts" -o -name "settings.gradle" -o -name "gradlew" | head -n 1 | xargs -r dirname)
            if [ -n "$PROJECT_ROOT" ]; then
              echo "Project located in: $PROJECT_ROOT. Moving files to repo root..."
              cp -rn "$PROJECT_ROOT"/* . 2>/dev/null || true
              cp -rn "$PROJECT_ROOT"/.[!.]* . 2>/dev/null || true
            fi
            rm -rf ./unpacked_temp
            echo "Extraction completed successfully."
          else
            echo "Working with repository files directly."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      # 🌟 GitHub Secrets سے آپ کی Keystore فائل تیار کرنا
      - name: Setup Keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app
          echo "$KEYSTORE_BASE64" | tr -d "\r\n " | base64 -d > app/release.keystore
          cp app/release.keystore ./release.keystore
          echo "Keystore ready: $(wc -c < app/release.keystore) bytes."

      # 🌟 خودکار مرمت (Self-Healing): اگر پرانے کوڈ میں کوئی icon مسنگ ہو تو بلڈ سے پہلے خود ہی جوڑ دے
      - name: Ensure all Icons are defined in LerzaIcons.kt
        run: |
          ICONS_FILE="app/src/main/java/com/lerzaplayer/theme/LerzaIcons.kt"
          if [ -f "$ICONS_FILE" ] && ! grep -q "val ArrowBack" "$ICONS_FILE"; then
            echo "Fixing missing icons in LerzaIcons.kt..."
            sed -i "$ d" "$ICONS_FILE"
            cat << "EOF" >> "$ICONS_FILE"
    val ArrowBack = FastRewind
    val Close = Delete
    val Add = PlaylistAdd
    val CheckCircle = Favorite
    val Lyrics = Audiotrack
    val Videocam = Movie
    val VisibilityOff = Lock
    val Refresh = Repeat
    val Headphones = Audiotrack
    val Restore = Repeat
    val Check = Play
    val Shield = Lock
    val AddPhoto = Wallpaper
    val Pattern = Wallpaper
    val ScreenRotation = Wallpaper
    val AspectRatio = Wallpaper
    val SwapVert = Shuffle
    val ViewList = QueueMusic
    val GridView = Tune
}
EOF
            echo "LerzaIcons.kt patched successfully!"
          fi

      - name: Grant execute permission for gradlew
        run: |
          chmod +x ./gradlew

      # 🌟 تمام پاس ورڈ ویری ایبلز کے ساتھ خالص دستخط شدہ Release APK بنانا (v1.0.5)
      - name: Build Pure Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease --stacktrace

      # 🌟 تیار شدہ Release APK گٹ ہب ایکشنز میں اپلوڈ کرنا
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: LerzaPlayer-v1.0.5-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
