name: Build Lerza Player Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Auto Unzip ZIP Files If Present & Move Project to Root
      - name: Auto Unzip ZIP Files If Present
        run: |
          shopt -s nullglob
          zip_files=(*.zip)
          if [ ${#zip_files[@]} -gt 0 ]; then
            echo "ZIP file(s) found! Unzipping..."
            for file in "${zip_files[@]}"; do
              echo "Extracting $file..."
              unzip -o "$file"
            done
            echo "Unzipping completed successfully."
          fi

          # खोजें कि build.gradle या build.gradle.kts कहाँ मौजूद है
          GRADLE_BUILD_PATH=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)

          if [ -n "$GRADLE_BUILD_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLE_BUILD_PATH")
            echo "Found Android Project inside directory: $PROJECT_DIR"
            if [ "$PROJECT_DIR" != "." ]; then
              echo "Moving files from $PROJECT_DIR to root..."
              cp -rn "$PROJECT_DIR"/* . 2>/dev/null || true
              cp -rn "$PROJECT_DIR"/.* . 2>/dev/null || true
            fi
          else
            echo "Warning: No build.gradle file found in repository or extracted ZIP."
          fi

      - name: Debug File Structure
        run: |
          echo "=== Current Root Files ==="
          ls -la

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Ensure Executable Gradlew
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found! Generating wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew
          ls -la gradlew gradle/wrapper/ || true

      # Decode Keystore from Secret
      - name: Decode Keystore from Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "Decoding release keystore..."
          mkdir -p app
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore

      # Build Signed Release APK
      - name: Build Signed Release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8 -Dkotlin.compiler.execution.strategy=in-process -Dkotlin.incremental=false"
          SIGNING_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      # Upload Signed APK
      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lerza-Player-Signed-v1.0.5
          path: '**/build/outputs/apk/release/*.apk'
          if-no-files-found: error
          retention-days: 30
