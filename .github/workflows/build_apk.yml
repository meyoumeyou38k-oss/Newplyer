name: Build Lerza Player Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Auto Unzip ZIP Files If Present & Fix Subfolders
        run: |
          # 1. अगर कोई Zip फाइल है तो उसे Unzip करें
          for zipfile in $(find . -maxdepth 3 -name "*.zip"); do
            echo "Unzipping $zipfile..."
            unzip -o "$zipfile" -d . || true
          done

          # 2. अगर सब-फ़ोल्डर में प्रोजेक्ट है, तो सभी फाइलों को रूट पर लाएं
          SETTINGS_FILE=$(find . -name "settings.gradle*" | head -n 1)
          if [ -n "$SETTINGS_FILE" ]; then
            SUBDIR=$(dirname "$SETTINGS_FILE")
            if [ "$SUBDIR" != "." ]; then
              echo "Moving files from $SUBDIR to root..."
              cp -r $SUBDIR/. . || true
            fi
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Executable Gradlew
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            echo "Generating gradle wrapper..."
            gradle wrapper || true
            chmod +x gradlew || true
          fi

      - name: Build Debug APK
        run: |
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            echo "Wrapper JAR not found, using system gradle..."
            gradle assembleDebug --no-daemon
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lerza-Player-debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: warn
