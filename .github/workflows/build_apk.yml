name: Build Lerza Player Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Auto Unzip ZIP Files If Present & Fix Subfolders
        run: |
          # 1. अगर ज़िप फाइल डायरेक्ट अपलोड हुई है तो उसे अनज़िप करें
          for zipfile in $(find . -maxdepth 2 -name "*.zip"); do
            echo "Unzipping $zipfile..."
            unzip -o "$zipfile" -d . || true
          done

          # 2. अगर फाइलें किसी सब-फोल्डर में हैं तो उन्हें रूट पर ले आएं
          if [ ! -f "gradlew" ] && [ ! -f "settings.gradle.kts" ]; then
            SUBDIR=$(find . -maxdepth 3 -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
            if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
              echo "Project files found in $SUBDIR -> Moving to root..."
              cp -rn "$SUBDIR"/* . || cp -r "$SUBDIR"/* .
            fi
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Executable Gradlew
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            echo "gradlew not found, generating wrapper..."
            gradle wrapper || true
            chmod +x gradlew || true
          fi

      - name: Build Debug APK
        run: |
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew --no-daemon assembleDebug
          else
            echo "Wrapper JAR not found, using system gradle..."
            gradle --no-daemon assembleDebug
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lerza-Player-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
