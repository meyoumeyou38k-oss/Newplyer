name: Android Build & Release APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. سورس کوڈ چیک آؤٹ
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. اگر زپ فائل اپلوڈ کی گئی ہے تو اسے خودکار ان-زپ کرنا
      - name: Unpack uploaded ZIP project (if any)
        run: |
          echo "Checking for any uploaded ZIP files..."
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" -not -path "*/.*" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP file: $ZIP_FILE"
            echo "Extracting $ZIP_FILE..."
            mkdir -p ./_temp_extract
            unzip -q -o "$ZIP_FILE" -d ./_temp_extract

            # زپ کے اندر گریڈل فائل ڈھونڈنا
            GRADLEW_FILE=$(find ./_temp_extract -name "gradlew" -type f | head -n 1)

            if [ -n "$GRADLEW_FILE" ]; then
              PROJECT_ROOT=$(dirname "$GRADLEW_FILE")
              echo "Found Android project root at: $PROJECT_ROOT"

              # تمام فائلوں کو پروجیکٹ روٹ میں منتقل کرنا
              shopt -s dotglob
              cp -rf "$PROJECT_ROOT"/* .
              shopt -u dotglob
            else
              echo "gradlew not in subfolder, copying all extracted files to root..."
              shopt -s dotglob
              cp -rf ./_temp_extract/* .
              shopt -u dotglob
            fi

            rm -rf ./_temp_extract
            echo "Project unpacked successfully!"
          else
            echo "No ZIP file found. Project files already present in repository."
          fi

          echo "Directory structure check:"
          ls -la

      # 3. جاوا 17 سیٹ اپ
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 4. gradlew کو ایگزیکیوٹ پرمیشن دینا
      - name: Make gradlew executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "Error: gradlew file not found in current directory!"
            ls -la
            exit 1
          fi

      # 5. گٹ ہب سیکرٹس سے کی اسٹور (release.keystore) ڈیکوڈ کرنا
      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore..."
            mkdir -p app
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > app/release.keystore
            cp app/release.keystore ./release.keystore
            echo "Keystore successfully created at app/release.keystore ($(wc -c < app/release.keystore) bytes)"
          else
            echo "Notice: KEYSTORE_BASE64 secret is not set. Will proceed with debug build."
          fi

      # 6. ریلیز اور ڈیبگ APK بلڈ کرنا
      - name: Build Android APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Starting Gradle APK compilation..."
          if [ -f "app/release.keystore" ] && [ -n "$STORE_PASSWORD" ]; then
            echo "Building signed Release APK and Debug APK..."
            ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace
          else
            echo "Building Debug APK..."
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      # 7. تیار شدہ APK فائلوں کی تصدیق
      - name: List Generated APKs
        run: |
          echo "Generated APK files:"
          find app/build/outputs/apk/ -type f -name "*.apk" -exec ls -lh {} +

      # 8. گٹ ہب ایکشنز پر APK اپلوڈ کرنا
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LerzaPlayer-APKs
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
