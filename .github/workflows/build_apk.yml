name: Android Build & APK Generator

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # 🌟 خود بخود زپ فائل تلاش کر کے ان زپ کرنا
      - name: Auto-extract project zip if uploaded
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip file: $ZIP_FILE. Extracting..."
            mkdir -p ./unpacked_temp
            unzip -o "$ZIP_FILE" -d ./unpacked_temp/

            # gradlew یا settings.gradle.kts کا فولڈر تلاش کریں
            PROJECT_ROOT=$(find ./unpacked_temp -name "settings.gradle.kts" -o -name "settings.gradle" -o -name "gradlew" | head -n 1 | xargs -r dirname)
            if [ -n "$PROJECT_ROOT" ]; then
              echo "Project located in: $PROJECT_ROOT. Moving files to repo root..."
              cp -rn "$PROJECT_ROOT"/* . 2>/dev/null || true
              cp -rn "$PROJECT_ROOT"/.[!.]* . 2>/dev/null || true
            fi
            rm -rf ./unpacked_temp
            echo "Extraction completed successfully."
          else
            echo "No zip archive detected; working with repository files directly."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      # 🌟 Keystore سیکرٹ ہینڈلنگ (اگر آپ نے گٹ ہب میں سیکرٹس دیے ہوں)
      - name: Setup Keystore from Secrets (if provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Writing keystore to app/release.keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          else
            echo "No keystore secret provided. Debug signing fallback will be used."
          fi

      - name: Grant execute permission for gradlew
        run: |
          chmod +x ./gradlew

      - name: Build Android APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD || 'android' }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || secrets.KEY_ALIAS || 'androiddebugkey' }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || secrets.KEY_PASSWORD || 'android' }}
        run: |
          ./gradlew --no-daemon assembleDebug assembleRelease --stacktrace || ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LerzaPlayer-APKs
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
