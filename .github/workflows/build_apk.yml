name: Build Lerza Player Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Auto Unzip ZIP Files If Present
        run: |
          for zipfile in $(find . -maxdepth 3 -name "*.zip"); do
            echo "Unzipping $zipfile..."
            unzip -o "$zipfile" -d . || true
          done

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Find Project Root and Build APK
        run: |
          # 1. खोजें कि settings.gradle या build.gradle कहाँ स्थित है
          BUILD_DIR=$(find . -name "settings.gradle*" -o -name "build.gradle*" | head -n 1 | xargs -r dirname)

          if [ -z "$BUILD_DIR" ]; then
            echo "Error: No Gradle build files found in repository!"
            exit 1
          fi

          echo "Found Gradle project in: $BUILD_DIR"
          cd "$BUILD_DIR"

          # 2. Executable permission दें अगर gradlew मौजूद हो
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lerza-Player-debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: warn
